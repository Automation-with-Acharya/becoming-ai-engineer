# pytest.ini — pytest configuration for Student Management System
#
# Day 035 Exercise 2: Introduce test markers.
# Day 035 Exercise 7: Add @pytest.mark.smoke for CI/CD smoke gate.
#
# Registered markers prevent PytestUnknownMarkWarning and allow selective
# test execution:
#   pytest -m unit          → unit tests only (no DB, fast)
#   pytest -m integration   → integration tests only (needs local PostgreSQL)
#   pytest -m api           → API layer tests only (HTTP + mocks, fast)
#   pytest -m smoke         → smoke tests (critical path, runs first in CI/CD)
#   pytest -m "not integration" → everything except integration
#
# Coverage configuration: source is the project root; excludes tests/ itself.

[pytest]
markers =
    unit: Unit tests — isolate a single class using MagicMock; no DB required
    integration: Integration tests — require a real local PostgreSQL connection
    api: API tests — exercise HTTP layer via FastAPI TestClient; no DB required
    smoke: Smoke tests — critical-path subset; should pass before every deployment

# Restrict test discovery to the tests/ directory only.
# This prevents pytest from picking up old_versions/ or other legacy code
# that may have test files with conflicting module names.
testpaths = tests

# Exclude legacy snapshot directories from test collection.
norecursedirs = old_versions .git __pycache__ .pytest_cache htmlcov

# Coverage defaults (used by `pytest --cov` and `coverage run -m pytest`).
addopts = --tb=short
